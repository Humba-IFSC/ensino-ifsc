<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Interativo — Aula 03: Diagramas de Fases</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background: #0a0e17; color: #f0f4f8; margin: 0; padding: 2rem 1rem; }
        .container { max-width: 800px; margin: 0 auto; background: rgba(15,23,42,0.85); border: 1px solid rgba(255,255,255,0.08); border-radius: 1rem; padding: 2.5rem; }
        h1 { color: #fbbf24; font-size: 1.8rem; margin-bottom: 2rem; }
        .question-card { background: rgba(245,158,11,0.05); border: 1px solid rgba(245,158,11,0.2); border-radius: 0.75rem; padding: 1.5rem; margin-bottom: 1.5rem; }
        .question-title { font-weight: 700; font-size: 1.05rem; margin-bottom: 1rem; }
        .options { display: flex; flex-direction: column; gap: 0.5rem; }
        .option-btn { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 0.5rem; padding: 0.75rem 1rem; color: #cbd5e1; text-align: left; cursor: pointer; transition: all 0.2s; font-size: 0.95rem; }
        .option-btn:hover { background: rgba(255,255,255,0.12); color: #fff; }
        .option-btn.correct { background: rgba(34,197,94,0.2) !important; border-color: #22c55e !important; color: #4ade80 !important; }
        .explanation { display: none; margin-top: 1rem; padding: 0.75rem; background: rgba(0,0,0,0.3); border-radius: 0.5rem; font-size: 0.85rem; color: #94a3b8; }
        .btn-back { display: inline-block; background: rgba(255,255,255,0.08); color: #cbd5e1; text-decoration: none; padding: 0.5rem 1rem; border-radius: 0.5rem; font-size: 0.85rem; margin-bottom: 1.5rem; }
    </style>
</head>
<body>
    <div class="container">
        <a href="../../../index.html" class="btn-back">← Voltar para Central da Termodinâmica</a>
        <h1>📝 Quiz Interativo — Aula 03: Diagramas de Fases</h1>

        <div class="question-card" id="q1">
            <div class="question-title">1. Em altitudes elevadas onde a pressão é menor, a água ferve a uma temperatura:</div>
            <div class="options">
                <button class="option-btn" onclick="check(this, 'q1', true)">A) Inferior a 100 °C</button>
                <button class="option-btn" onclick="check(this, 'q1', false)">B) Superior a 100 °C</button>
            </div>
            <div class="explanation"><strong>Gabarito A:</strong> Menor pressão ambiente reduz a temperatura de ebulição do líquido.</div>
        </div>
    </div>

    <script>
        function check(btn, qId, isCorrect) {
            const card = document.getElementById(qId);
            card.querySelectorAll('.option-btn').forEach(b => b.disabled = true);
            if (isCorrect) btn.classList.add('correct');
            card.querySelector('.explanation').style.display = 'block';
        }
    </script>
</body>
</html>
