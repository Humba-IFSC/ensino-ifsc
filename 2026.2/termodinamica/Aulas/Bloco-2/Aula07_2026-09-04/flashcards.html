<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flashcards — Aula 07: Diagramas de Fases e Termologia</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
        window.MathJax = {
            tex: { inlineMath: [['$', '$'], ['\\(', '\\)']], displayMath: [['$$', '$$']] },
            svg: { fontCache: 'global' }
        };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
        :root {
            --bg-main: #0a0e17;
            --bg-card: rgba(15, 23, 42, 0.85);
            --border-card: rgba(245, 158, 11, 0.25);
            --accent-green: #4ade80;
            --accent-amber: #f59e0b;
            --accent-cyan: #38bdf8;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-main);
            color: var(--text-primary);
            min-height: 100vh;
            padding: 2rem 1rem;
            background-image: 
                radial-gradient(circle at 15% 15%, rgba(245, 158, 11, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 85% 85%, rgba(74, 222, 128, 0.08) 0%, transparent 40%);
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        .btn-back {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            background: rgba(255, 255, 255, 0.06);
            color: #cbd5e1;
            text-decoration: none;
            padding: 0.6rem 1.2rem;
            border-radius: 0.6rem;
            font-size: 0.88rem;
            font-weight: 600;
            border: 1px solid rgba(255, 255, 255, 0.1);
            margin-bottom: 1.5rem;
            transition: all 0.2s ease;
        }
        .btn-back:hover {
            background: rgba(255, 255, 255, 0.12);
            color: #fff;
            transform: translateX(-2px);
        }

        .header {
            text-align: center;
            margin-bottom: 2rem;
        }
        .header h1 {
            font-size: 1.8rem;
            font-weight: 800;
            background: linear-gradient(135deg, var(--accent-amber), var(--accent-green));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
        }
        .header p {
            color: var(--text-secondary);
            font-size: 0.95rem;
        }

        .stats-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 0.75rem;
            padding: 0.75rem 1.25rem;
            margin-bottom: 1.5rem;
            font-size: 0.88rem;
            color: var(--text-secondary);
        }
        .progress-bar-bg {
            flex: 1;
            height: 8px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            margin: 0 1rem;
            overflow: hidden;
        }
        .progress-bar-fill {
            height: 100%;
            width: 2%;
            background: linear-gradient(90deg, var(--accent-amber), var(--accent-green));
            transition: width 0.3s ease;
            border-radius: 4px;
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 0.75rem;
            margin-bottom: 2rem;
            flex-wrap: wrap;
        }
        .btn-ctrl {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: #e2e8f0;
            padding: 0.6rem 1.2rem;
            border-radius: 0.6rem;
            font-weight: 600;
            font-size: 0.88rem;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }
        .btn-ctrl:hover {
            background: rgba(245, 158, 11, 0.15);
            border-color: var(--accent-amber);
            color: #fff;
        }

        .grid-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(360px, 1fr));
            gap: 1.5rem;
        }

        .flashcard {
            perspective: 1000px;
            height: 240px;
            cursor: pointer;
        }

        .flashcard-inner {
            position: relative;
            width: 100%;
            height: 100%;
            text-align: center;
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            transform-style: preserve-3d;
            border-radius: 1rem;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
        }

        .flashcard.flipped .flashcard-inner {
            transform: rotateY(180deg);
        }

        .card-front, .card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
            border-radius: 1rem;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            border: 1px solid var(--border-card);
        }

        .card-front {
            background: linear-gradient(145deg, rgba(15, 23, 42, 0.95), rgba(30, 41, 59, 0.8));
            color: #f1f5f9;
        }

        .card-back {
            background: linear-gradient(145deg, rgba(60, 30, 10, 0.95), rgba(15, 23, 42, 0.95));
            color: #e2e8f0;
            transform: rotateY(180deg);
            border-color: rgba(245, 158, 11, 0.4);
        }

        .card-tag {
            font-size: 0.72rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            padding: 0.25rem 0.6rem;
            border-radius: 0.4rem;
        }
        .card-front .card-tag {
            background: rgba(245, 158, 11, 0.15);
            color: var(--accent-amber);
            border: 1px solid rgba(245, 158, 11, 0.3);
        }
        .card-back .card-tag {
            background: rgba(74, 222, 128, 0.15);
            color: var(--accent-green);
            border: 1px solid rgba(74, 222, 128, 0.3);
        }

        .card-body {
            font-size: 0.95rem;
            font-weight: 600;
            line-height: 1.45;
            display: flex;
            align-items: center;
            justify-content: center;
            flex: 1;
            width: 100%;
        }

        .card-hint {
            font-size: 0.75rem;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            gap: 0.3rem;
        }

        @media (max-width: 640px) {
            .grid-cards { grid-template-columns: 1fr; }
            .flashcard { height: 260px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="../../../index.html" class="btn-back">← Voltar para Central de Ensino</a>

        <div class="header">
            <h1>🧠 Flashcards de Estudo — Aula 07</h1>
            <p>Diagramas de Fases ($p 	imes T$), Ponto Triplo, Ponto Crítico e Mudanças de Fase sob Pressão</p>
        </div>

        <div class="stats-bar">
            <span id="counterText">15 Cartões de Estudo</span>
            <div class="progress-bar-bg">
                <div class="progress-bar-fill" id="progressFill"></div>
            </div>
            <span>Clique para revelar a resposta 🔄</span>
        </div>

        <div class="controls">
            <button class="btn-ctrl" onclick="shuffleCards()">🎲 Embaralhar</button>
            <button class="btn-ctrl" onclick="flipAll()">🔄 Virar Todos</button>
            <button class="btn-ctrl" onclick="resetCards()">↺ Reiniciar</button>
        </div>

        <div class="grid-cards" id="cardsGrid"></div>
    </div>

    <script>
        const cardsData = [
            {
                        "front": "Como se define o diagrama de fases de uma substância pura?",
                        "back": "É a representação gráfica da pressão $p$ em função da temperatura $\\theta$ que indica em qual estado físico a substância se encontra."
            },
            {
                        "front": "O que representa o ponto triplo (ou tríplice) em um diagrama de fases?",
                        "back": "O estado de equilíbrio simultâneo entre as três fases da substância: sólida, líquida e de vapor."
            },
            {
                        "front": "No diagrama de fases, qual curva representa os estados de equilíbrio entre as fases sólida e líquida?",
                        "back": "A curva de fusão."
            },
            {
                        "front": "Qual é o efeito do aumento da pressão externa sobre a temperatura de ebulição de qualquer líquido?",
                        "back": "O aumento da pressão eleva a temperatura de ebulição."
            },
            {
                        "front": "Por que a temperatura de fusão da água diminui quando a pressão sobre ela aumenta?",
                        "back": "Porque a água é uma substância que se contrai na fusão, e o aumento de pressão favorece essa redução de volume."
            },
            {
                        "front": "O que caracteriza o ponto crítico ($C$) em um diagrama de fases?",
                        "back": "É o ponto final da curva de vaporização acima do qual não é possível distinguir entre as fases líquida e de vapor."
            },
            {
                        "front": "Termodinamicamente, qual é a diferença entre um vapor e um gás?",
                        "back": "Vapor existe abaixo da temperatura crítica e pode ser liquefeito por compressão; gás existe acima dela e não pode ser liquefeito apenas por compressão."
            },
            {
                        "front": "Qual curva no diagrama de fases delimita as regiões das fases sólida e de vapor?",
                        "back": "A curva de sublimação."
            },
            {
                        "front": "Explique o fenômeno do regelo observado na experiência de Tyndall.",
                        "back": "A pressão de um fio sobre o gelo reduz seu ponto de fusão, fazendo-o derreter; ao passar o fio, a pressão volta ao normal e a água solidifica-se novamente."
            },
            {
                        "front": "De qual fator físico depende exclusivamente a pressão máxima de vapor de uma substância?",
                        "back": "Exclusivamente da temperatura da substância."
            },
            {
                        "front": "Por que os alimentos cozinham em menos tempo no interior de uma panela de pressão?",
                        "back": "Porque a pressão interna superior a $1$ $atm$ faz com que a água ferva a uma temperatura superior a $100$ $^\\circ C$."
            },
            {
                        "front": "Sob quais condições de pressão e temperatura ocorre o ponto triplo da água?",
                        "back": "Sob pressão de $4,58$ $mmHg$ e temperatura de $0,01$ $^\\circ C$."
            },
            {
                        "front": "No gráfico $p \\times V$ (Isotermas de Andrews), o que ocorre com o patamar de liquefação quando a temperatura atinge o valor crítico?",
                        "back": "O patamar desaparece, reduzindo-se a um único ponto denominado ponto crítico."
            },
            {
                        "front": "Cite três exemplos de substâncias, além da água, que se contraem ao sofrer fusão.",
                        "back": "Bismuto, ferro e antimônio."
            },
            {
                        "front": "Por que o dióxido de carbono ($CO_{2}$) sólido (gelo-seco) sofre sublimação sob pressão atmosférica normal?",
                        "back": "Porque a pressão de seu ponto triplo ($5$ $atm$) é superior à pressão atmosférica normal ($1$ $atm$)."
            }
];

        let currentCards = [...cardsData];
        let flippedAll = false;

        function renderCards() {
            const grid = document.getElementById('cardsGrid');
            grid.innerHTML = '';

            currentCards.forEach((c, idx) => {
                const cardEl = document.createElement('div');
                cardEl.className = 'flashcard';
                cardEl.onclick = () => cardEl.classList.toggle('flipped');

                cardEl.innerHTML = `
                    <div class="flashcard-inner">
                        <div class="card-front">
                            <span class="card-tag">Cartão ${idx + 1} de ${currentCards.length}</span>
                            <div class="card-body">${c.front}</div>
                            <div class="card-hint">💡 Clique para ver a resposta</div>
                        </div>
                        <div class="card-back">
                            <span class="card-tag">Conceito / Resposta</span>
                            <div class="card-body">${c.back}</div>
                            <div class="card-hint">🔄 Clique para voltar à pergunta</div>
                        </div>
                    </div>
                `;

                grid.appendChild(cardEl);
            });

            if (window.MathJax) {
                MathJax.typesetPromise();
            }
        }

        function shuffleCards() {
            currentCards.sort(() => Math.random() - 0.5);
            renderCards();
        }

        function flipAll() {
            flippedAll = !flippedAll;
            const allCards = document.querySelectorAll('.flashcard');
            allCards.forEach(c => {
                if (flippedAll) {
                    c.classList.add('flipped');
                } else {
                    c.classList.remove('flipped');
                }
            });
        }

        function resetCards() {
            flippedAll = false;
            currentCards = [...cardsData];
            renderCards();
        }

        window.onload = renderCards;
    </script>
</body>
</html>
