<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz 3 (Avaliativo) — Aula 03: Diagramas de Fase e Propriedades Térmicas</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
        window.MathJax = {
            tex: { inlineMath: [['$', '$'], ['\\(', '\\)']], displayMath: [['$$', '$$']] },
            svg: { fontCache: 'global' }
        };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
        :root {
            --bg-main: #0a0e17;
            --bg-card: rgba(15, 23, 42, 0.85);
            --border-card: rgba(249, 115, 22, 0.25);
            --accent-orange: #f97316;
            --accent-amber: #fbbf24;
            --accent-green: #4ade80;
            --accent-red: #fca5a5;
            --text-primary: #f8fafc;
            --text-secondary: #cbd5e1;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-main);
            color: var(--text-primary);
            min-height: 100vh;
            padding: 2rem 1rem;
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(249, 115, 22, 0.06) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(251, 191, 36, 0.06) 0%, transparent 40%);
        }

        .container { max-width: 850px; margin: 0 auto; }

        .btn-back {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            background: rgba(255, 255, 255, 0.06);
            color: #cbd5e1;
            text-decoration: none;
            padding: 0.6rem 1.2rem;
            border-radius: 0.6rem;
            font-size: 0.88rem;
            font-weight: 600;
            border: 1px solid rgba(255, 255, 255, 0.1);
            margin-bottom: 1.5rem;
            transition: all 0.2s ease;
        }
        .btn-back:hover { background: rgba(255, 255, 255, 0.12); color: #fff; }

        .login-card {
            background: var(--bg-card);
            border: 1px solid var(--border-card);
            border-radius: 1.25rem;
            padding: 2.5rem;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(12px);
        }

        .login-header h1 {
            font-size: 1.9rem;
            font-weight: 800;
            background: linear-gradient(135deg, var(--accent-orange), var(--accent-amber));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
            text-align: center;
        }

        .form-group { margin-bottom: 1.25rem; }
        .form-group label { display: block; font-size: 0.88rem; font-weight: 700; color: #cbd5e1; margin-bottom: 0.5rem; }
        .form-control { width: 100%; background: rgba(0, 0, 0, 0.4); border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 0.6rem; padding: 0.8rem 1rem; color: #fff; font-size: 0.95rem; outline: none; transition: all 0.2s; }
        .form-control:focus { border-color: var(--accent-orange); box-shadow: 0 0 0 3px rgba(249, 115, 22, 0.2); }

        .btn-start {
            width: 100%;
            background: linear-gradient(135deg, #ea580c, #c2410c);
            color: #fff;
            border: none;
            border-radius: 0.75rem;
            padding: 1rem;
            font-size: 1.05rem;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.2s ease;
            margin-top: 1.5rem;
            box-shadow: 0 8px 20px rgba(234, 88, 12, 0.3);
        }
        .btn-start:hover { transform: translateY(-2px); box-shadow: 0 12px 25px rgba(234, 88, 12, 0.4); }

        #quizScreen { display: none; }
        .sticky-timer-bar {
            position: sticky;
            top: 1rem;
            z-index: 100;
            background: rgba(15, 23, 42, 0.95);
            border: 1px solid var(--border-card);
            border-radius: 1rem;
            padding: 1rem 1.5rem;
            margin-bottom: 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            backdrop-filter: blur(10px);
        }

        .question-card {
            background: var(--bg-card);
            border: 1px solid var(--border-card);
            border-radius: 1.25rem;
            padding: 1.8rem;
            margin-bottom: 1.5rem;
        }

        .question-title { font-weight: 700; font-size: 1.05rem; color: #fff; margin-bottom: 1rem; line-height: 1.45; }
        .options-list { display: flex; flex-direction: column; gap: 0.6rem; }
        .option-item {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 0.6rem;
            padding: 0.85rem 1.1rem;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }
        .option-item:hover { background: rgba(249, 115, 22, 0.12); border-color: rgba(249, 115, 22, 0.3); }
        .option-item input { accent-color: var(--accent-orange); width: 1.1rem; height: 1.1rem; }

        #resultScreen { display: none; }
        .review-card { background: var(--bg-card); border-radius: 1rem; padding: 1.5rem; margin-bottom: 1rem; border: 1px solid rgba(255,255,255,0.08); }
        .review-card.correct { border-left: 4px solid var(--accent-green); }
        .review-card.incorrect { border-left: 4px solid var(--accent-red); }
    </style>
</head>
<body>
    <div class="container">
        <a href="../../../index.html" class="btn-back">← Voltar para Central da Termodinâmica</a>

        <!-- TELA 1: LOGIN -->
        <div id="loginScreen" class="login-card">
            <div class="login-header">
                <h1>📝 Quiz 3 — Diagramas de Fase e Propriedades Térmicas</h1>
                <p>Avaliação individual · 10 Questões · Tempo limite: 30 minutos</p>
            </div>

            <form id="startForm" onsubmit="startQuiz(event)">
                <div class="form-group">
                    <label for="studentName">👤 Nome Completo do Aluno:</label>
                    <input type="text" id="studentName" class="form-control" placeholder="Digite seu nome completo" required>
                </div>

                <div class="form-group">
                    <label for="studentEmail">📧 E-mail Institucional ou Pessoal:</label>
                    <input type="email" id="studentEmail" class="form-control" placeholder="exemplo@aluno.ifsc.edu.br" required>
                </div>

                <div class="form-group">
                    <label for="quizPassword">🔑 Senha de Acesso (liberada pelo professor):</label>
                    <input type="password" id="quizPassword" class="form-control" placeholder="Digite a senha de acesso" required>
                </div>

                <button type="submit" class="btn-start">🚀 Iniciar Avaliação</button>
            </form>
        </div>

        <!-- TELA 2: QUIZ ATIVO -->
        <div id="quizScreen">
            <div class="sticky-timer-bar">
                <div>
                    <div style="font-weight: 700;" id="activeStudent">Aluno</div>
                    <div style="font-size: 0.8rem; color: #94a3b8;" id="activeEmail">email@ifsc.edu.br</div>
                </div>
                <div style="font-family: monospace; font-size: 1.3rem; font-weight: 800; color: var(--accent-orange);" id="timerDisplay">30:00</div>
            </div>

            <form id="quizForm" onsubmit="submitQuiz(event)">
                <div id="questionsContainer"></div>
                <button type="submit" class="btn-start" style="margin-bottom: 3rem;">📥 Enviar Respostas e Finalizar</button>
            </form>
        </div>

        <!-- TELA 3: RESULTADOS -->
        <div id="resultScreen" class="login-card">
            <h1 style="color: var(--accent-green); text-align: center; margin-bottom: 1rem;">✅ Avaliação Concluída!</h1>
            <div style="text-align: center; background: rgba(0,0,0,0.3); padding: 1.5rem; border-radius: 1rem; margin-bottom: 1.5rem; border: 1px solid rgba(255,255,255,0.08);">
                <div style="font-size: 2.2rem; font-weight: 800; color: var(--accent-amber);" id="resScoreNum">0 / 10</div>
                <div style="font-size: 1rem; color: #cbd5e1; margin-top: 0.3rem;" id="resPercentText">0% de Aproveitamento</div>
                <div style="font-size: 0.82rem; color: #94a3b8; margin-top: 0.8rem;">Código de Validação: <strong id="resAuthCode" style="color:#fff;">-</strong></div>
            </div>

            <div id="reviewContainer"></div>
        </div>
    </div>

    <script>
        const ACCESS_PASSWORD_HASH = "TERMO2026";
        const TOTAL_TIME_SECONDS = 30 * 60;
        const GOOGLE_APP_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxbfPU1T8DYQ7v8j8Dc5goqZXleR4avaDsGuzUj07HwwoqiE43GRmEy4hvMgcgi_5vJ/exec";
        const GABARITO_RELEASE_DATE = "2026-09-10T23:59:59";

        const questionsData = [
            {
                id: 1,
                title: "1. O que caracteriza o Ponto Triplo (Tríplice) em um diagrama de fases (p x T)?",
                options: [
                    { letter: "A", text: "É o ponto em que a substância atinge a menor temperatura possível no universo." },
                    { letter: "B", text: "É a única combinação de pressão e temperatura onde as fases sólida, líquida e gasosa coexistem em equilíbrio simultâneo." },
                    { letter: "C", text: "É o ponto onde a pressão atmosférica torna-se igual a zero." },
                    { letter: "D", text: "É a transição direta do estado gasoso para o estado de plasma." }
                ],
                answer: "B",
                rationale: "No ponto triplo, as três curvas de equilíbrio (fusão, vaporização e sublimação) se cruzam, permitindo a coexistência simultânea das três fases."
            },
            {
                id: 2,
                title: "2. Qual a diferença conceitual entre um 'Gás' e um 'Vapor'?",
                options: [
                    { letter: "A", text: "O vapor é de cor visível e o gás é sempre invisível." },
                    { letter: "B", text: "O vapor encontra-se a uma temperatura abaixo da temperatura crítica (Tc) e pode ser liquefeito apenas por aumento de pressão; o gás está acima de Tc e não liquefaz por compressão." },
                    { letter: "C", text: "O gás tem massa e o vapor não possui massa." },
                    { letter: "D", text: "O gás só existe no vácuo e o vapor na atmosfera." }
                ],
                answer: "B",
                rationale: "Acima da temperatura crítica (Tc), a energia térmica impede a liquefação puramente por compressão isotérmica, caracterizando o estado gasoso."
            },
            {
                id: 3,
                title: "3. Por que a curva de fusão da água apresenta uma inclinação negativa no diagrama de fases?",
                options: [
                    { letter: "A", text: "Porque a água se expande ao fundir." },
                    { letter: "B", text: "Porque a água se contrai ao fundir (o gelo é menos denso que a água líquida), fazendo com que o aumento de pressão reduza a temperatura de fusão." },
                    { letter: "C", text: "Porque a água não possui ponto triplo." },
                    { letter: "D", text: "Porque a gravidade terrestre altera a força intermolecular no gelo." }
                ],
                answer: "B",
                rationale: "Como a água sólida ocupa maior volume específico que a líquida, aumentar a pressão favorece a fase líquida de menor volume, reduzindo o ponto de fusão."
            },
            {
                id: 4,
                title: "4. Como o funcionamento de uma panela de pressão relaciona-se com o diagrama de fases da água?",
                options: [
                    { letter: "A", text: "A panela reduz a pressão interna, fazendo a água ferver a 50 °C." },
                    { letter: "B", text: "A panela retém o vapor, aumentando a pressão interna e elevando a temperatura de ebulição da água para cerca de 120 °C." },
                    { letter: "C", text: "A panela impede a transferência de calor para o meio ambiente sem alterar a pressão." },
                    { letter: "D", text: "A panela transforma a água líquida em gelo seco." }
                ],
                answer: "B",
                rationale: "Pela curva de vaporização, o aumento da pressão eleva a temperatura de ebulição da água, acelerando o cozimento."
            },
            {
                id: 5,
                title: "5. O que ocorre no fenômeno do regelo (experiência do fio metálico atravessando um bloco de gelo)?",
                options: [
                    { letter: "A", text: "O fio derrete o gelo pelo calor gerado por atrito e o bloco se divide em dois." },
                    { letter: "B", text: "A alta pressão sob o fio reduz a T de fusão, fundindo o gelo; a água resultante sobe, volta à pressão normal e recongela imediatamente." },
                    { letter: "C", text: "O gelo sublima instantaneamente sob o fio sem formar água." },
                    { letter: "D", text: "O fio fica preso no gelo e não consegue avançar." }
                ],
                answer: "B",
                rationale: "O regelo demonstra que a alta pressão reduz a T de fusão do gelo. Quando a pressão cessa em cima do fio, a água congela novamente."
            },
            {
                id: 6,
                title: "6. Em cidades situadas em altitudes muito elevadas (como La Paz), a pressão atmosférica é menor. Qual o impacto disso no cozimento dos alimentos em água aberta?",
                options: [
                    { letter: "A", text: "A água ferve a mais de 100 °C, cozinhando mais rápido." },
                    { letter: "B", text: "A água ferve a uma temperatura inferior a 100 °C, exigindo maior tempo para o cozimento." },
                    { letter: "C", text: "A água não consegue entrar em ebulição em altitude elevada." },
                    { letter: "D", text: "O tempo de cozimento permanece inalterado." }
                ],
                answer: "B",
                rationale: "Com a menor pressão atmosférica, a pressão de vapor atinge a pressão externa em temperaturas mais baixas (ex.: 88 °C em La Paz), desacelerando o cozimento."
            },
            {
                id: 7,
                title: "7. O que é o Ponto Crítico no diagrama de fases p x T?",
                options: [
                    { letter: "A", text: "O ponto em que a substância entra em combustão." },
                    { letter: "B", text: "O ponto limite da curva de vaporização acima do qual cessa a distinção entre a fase líquida e a fase de vapor." },
                    { letter: "C", text: "O ponto onde a substância passa a ter massa nula." },
                    { letter: "D", text: "O ponto onde a curva de fusão cruza o eixo da temperatura em 0 K." }
                ],
                answer: "B",
                rationale: "No ponto crítico, as densidades do líquido e do vapor igualam-se, eliminando a menisco/fronteira física de separação."
            },
            {
                id: 8,
                title: "8. Se reduzirmos a pressão sobre um recipiente com água líquida mantida a 20 °C até valores muito baixos (ex.: 17,5 mmHg), o que se observa?",
                options: [
                    { letter: "A", text: "A água congela instantaneamente sem ebulir." },
                    { letter: "B", text: "A água entra em ebulição em temperatura ambiente." },
                    { letter: "C", text: "A água transforma-se em plasma." },
                    { letter: "D", text: "Nenhuma alteração é observada." }
                ],
                answer: "B",
                rationale: "Quando a pressão ambiente é reduzida até igualar a pressão máxima de vapor do líquido naquela T, ocorre ebulição à temperatura ambiente."
            },
            {
                id: 9,
                title: "9. Qual a diferença no comportamento da fusão entre substâncias normais (ex.: ferro) e substâncias anômalas (ex.: água)?",
                options: [
                    { letter: "A", text: "Substâncias normais expandem na fusão (pressão aumenta T de fusão); substâncias anômalas contraem na fusão (pressão reduz T de fusão)." },
                    { letter: "B", text: "Substâncias normais não possuem fase gasosa." },
                    { letter: "C", text: "Substâncias anômalas não variam de volume em nenhuma transição." },
                    { letter: "D", text: "Substâncias normais fundem no zero absoluto." }
                ],
                answer: "A",
                rationale: "Para substâncias normais a inclinação da curva de fusão no gráfico p x T é positiva; para substâncias anômalas como a água, é negativa."
            },
            {
                id: 10,
                title: "10. Por que as lâminas dos patins no gelo facilitam o deslizamento do patinador?",
                options: [
                    { letter: "A", text: "A lâmina aquece o ar ao redor por irradiação." },
                    { letter: "B", text: "A elevada pressão concentrada na pequena área da lâmina funde localmente o gelo, criando uma camada de água líquida lubrificante." },
                    { letter: "C", text: "A lâmina aumenta a força de atrito estático com o gelo." },
                    { letter: "D", text: "A lâmina impede qualquer mudança de fase do gelo." }
                ],
                answer: "B",
                rationale: "Devido ao comportamento anômalo da água, a alta pressão reduz a T de fusão, gerando uma película líquida que reduz o atrito."
            }
        ];

        let studentData = {};
        let timerInterval = null;
        let timeLeft = TOTAL_TIME_SECONDS;

        function startQuiz(e) {
            e.preventDefault();
            const pass = document.getElementById("quizPassword").value.trim();
            if (pass.toUpperCase() !== ACCESS_PASSWORD_HASH && pass !== "ifsc2026") {
                alert("❌ Senha incorreta! Verifique a senha liberada pelo professor.");
                return;
            }

            studentData = {
                name: document.getElementById("studentName").value.trim(),
                email: document.getElementById("studentEmail").value.trim()
            };

            document.getElementById("loginScreen").style.display = "none";
            document.getElementById("quizScreen").style.display = "block";
            document.getElementById("activeStudent").textContent = studentData.name;
            document.getElementById("activeEmail").textContent = studentData.email;

            renderQuestions();
            startTimer();
        }

        function renderQuestions() {
            const container = document.getElementById("questionsContainer");
            container.innerHTML = "";
            questionsData.forEach(q => {
                const card = document.createElement("div");
                card.className = "question-card";
                card.innerHTML = `
                    <div class="question-title">${q.title}</div>
                    <div class="options-list">
                        ${q.options.map(opt => `
                            <label class="option-item">
                                <input type="radio" name="q_${q.id}" value="${opt.letter}" required>
                                <span><strong>${opt.letter})</strong> ${opt.text}</span>
                            </label>
                        `).join("")}
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function startTimer() {
            timerInterval = setInterval(() => {
                timeLeft--;
                const min = String(Math.floor(timeLeft / 60)).padStart(2, '0');
                const sec = String(timeLeft % 60).padStart(2, '0');
                document.getElementById("timerDisplay").textContent = `${min}:${sec}`;

                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    alert("⏰ O tempo limite expirou! Suas respostas serão enviadas automaticamente.");
                    document.getElementById("quizForm").dispatchEvent(new Event('submit'));
                }
            }, 1000);
        }

        function submitQuiz(e) {
            e.preventDefault();
            clearInterval(timerInterval);

            const userAnswers = {};
            let correctCount = 0;

            questionsData.forEach(q => {
                const selected = document.querySelector(`input[name="q_${q.id}"]:checked`);
                const ans = selected ? selected.value : "N/A";
                userAnswers[q.id] = ans;
                if (ans === q.answer) correctCount++;
            });

            const percent = Math.round((correctCount / questionsData.length) * 100);
            const authHash = "TRM03-" + Math.random().toString(36).substr(2, 9).toUpperCase();

            // Envio para a Planilha Google
            if (GOOGLE_APP_SCRIPT_URL && GOOGLE_APP_SCRIPT_URL.startsWith("http")) {
                fetch(GOOGLE_APP_SCRIPT_URL, {
                    method: "POST",
                    mode: "no-cors",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        student: studentData.name,
                        email: studentData.email,
                        quiz: "Quiz 3 — Aula 03 (Termodinâmica)",
                        score: correctCount,
                        total: questionsData.length,
                        percent: percent + "%",
                        authCode: authHash
                    })
                }).catch(err => console.error(err));
            }

            document.getElementById("resScoreNum").textContent = `${correctCount} / ${questionsData.length}`;
            document.getElementById("resPercentText").textContent = `${percent}% de Aproveitamento`;
            document.getElementById("resAuthCode").textContent = authHash;

            renderReview(userAnswers);

            document.getElementById("quizScreen").style.display = "none";
            document.getElementById("resultScreen").style.display = "block";
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function renderReview(userAnswers) {
            const container = document.getElementById("reviewContainer");
            container.innerHTML = "";

            const unlocked = new Date() >= new Date(GABARITO_RELEASE_DATE);

            if (!unlocked) {
                const releaseFormatted = new Date(GABARITO_RELEASE_DATE).toLocaleString('pt-BR', { dateStyle: 'long', timeStyle: 'short' });
                container.innerHTML = `
                    <div style="background: rgba(245, 158, 11, 0.1); border: 1px solid rgba(245, 158, 11, 0.35); border-radius: 1rem; padding: 1.8rem; text-align: center; margin-top: 1rem;">
                        <div style="font-size: 2.5rem; margin-bottom: 0.5rem;">🔒</div>
                        <h3 style="color: #fbbf24; font-size: 1.2rem; font-weight: 800; margin-bottom: 0.5rem;">Gabarito Comentado Bloqueado Temporariamente</h3>
                        <p style="color: #e2e8f0; font-size: 0.95rem; margin-bottom: 1.2rem; max-width: 620px; margin-left: auto; margin-right: auto; line-height: 1.6;">
                            Para garantir a integridade da avaliação entre todos os discentes durante o prazo de realização, as justificativas teóricas e a correção questão por questão estarão disponíveis a partir de:
                        </p>
                        <div style="display: inline-block; background: rgba(0,0,0,0.5); border: 1px solid #f59e0b; color: #fbbf24; padding: 0.6rem 1.4rem; border-radius: 0.6rem; font-weight: 700; font-size: 1.05rem; margin-bottom: 1.2rem;">
                            📅 ${releaseFormatted}
                        </div>
                        <p style="color: #94a3b8; font-size: 0.85rem; font-style: italic;">
                            Sua pontuação final, tempo e comprovante com o código de validação já foram salvos no sistema.
                        </p>
                    </div>
                `;
                return;
            }

            questionsData.forEach(q => {
                const userAns = userAnswers[q.id] || "N/A";
                const isCorrect = userAns === q.answer;
                const card = document.createElement("div");
                card.className = `review-card ${isCorrect ? 'correct' : 'incorrect'}`;
                card.innerHTML = `
                    <div style="font-weight: 700; color: #fff; margin-bottom: 0.5rem;">${q.title}</div>
                    <div style="font-size: 0.9rem; margin-bottom: 0.4rem;">
                        Sua resposta: <strong style="color: ${isCorrect ? '#4ade80' : '#fca5a5'};">${userAns}</strong>
                        ${!isCorrect ? `| Gabarito: <strong style="color:#4ade80;">${q.answer}</strong>` : ''}
                    </div>
                    <div style="font-size: 0.85rem; color: #94a3b8; background: rgba(0,0,0,0.3); padding: 0.8rem; border-radius: 0.5rem; margin-top: 0.5rem;">
                        📖 <strong>Justificativa:</strong> ${q.rationale}
                    </div>
                `;
                container.appendChild(card);
            });
        }
    </script>
</body>
</html>
