<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flashcards — Aula 03: Diagramas de Fase e Propriedades Térmicas</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-main: #0a0e17;
            --bg-card: rgba(15, 23, 42, 0.9);
            --border-card: rgba(249, 115, 22, 0.3);
            --accent-orange: #f97316;
            --accent-amber: #fbbf24;
            --text-primary: #f8fafc;
            --text-secondary: #cbd5e1;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Inter', sans-serif; background-color: var(--bg-main); color: var(--text-primary); min-height: 100vh; padding: 2rem 1rem; }
        .container { max-width: 750px; margin: 0 auto; }
        .btn-back { display: inline-flex; align-items: center; gap: 0.5rem; background: rgba(255, 255, 255, 0.06); color: #cbd5e1; text-decoration: none; padding: 0.6rem 1.2rem; border-radius: 0.6rem; font-size: 0.88rem; font-weight: 600; border: 1px solid rgba(255, 255, 255, 0.1); margin-bottom: 1.5rem; transition: all 0.2s; }
        .btn-back:hover { background: rgba(255, 255, 255, 0.12); color: #fff; }
        .header { text-align: center; margin-bottom: 2rem; }
        .header h1 { font-size: 1.8rem; font-weight: 800; color: var(--accent-orange); margin-bottom: 0.4rem; }
        .header p { color: #94a3b8; font-size: 0.92rem; }
        
        .flashcard-wrapper { perspective: 1000px; margin-bottom: 2rem; }
        .flashcard { width: 100%; min-height: 280px; background: var(--bg-card); border: 1px solid var(--border-card); border-radius: 1.25rem; padding: 2.5rem; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; cursor: pointer; transition: transform 0.6s; transform-style: preserve-3d; position: relative; box-shadow: 0 20px 40px rgba(0,0,0,0.4); }
        .flashcard.flipped { transform: rotateY(180deg); }
        .front, .back { position: absolute; inset: 0; backface-visibility: hidden; padding: 2.5rem; display: flex; flex-direction: column; justify-content: center; align-items: center; border-radius: 1.25rem; }
        .back { transform: rotateY(180deg); background: rgba(30, 41, 59, 0.95); border: 1px solid var(--accent-amber); }
        .badge-cat { font-size: 0.72rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; background: rgba(249, 115, 22, 0.15); color: var(--accent-amber); padding: 0.3rem 0.8rem; border-radius: 9999px; margin-bottom: 1rem; border: 1px solid rgba(249, 115, 22, 0.3); }
        .card-text { font-size: 1.15rem; font-weight: 600; line-height: 1.5; color: #f1f5f9; }
        
        .controls { display: flex; justify-content: space-between; align-items: center; gap: 1rem; }
        .btn-ctrl { background: rgba(255, 255, 255, 0.08); color: #fff; border: 1px solid rgba(255, 255, 255, 0.15); padding: 0.8rem 1.5rem; border-radius: 0.75rem; font-weight: 700; font-size: 0.95rem; cursor: pointer; transition: all 0.2s; }
        .btn-ctrl:hover { background: rgba(249, 115, 22, 0.25); border-color: var(--accent-orange); }
        .progress-text { font-size: 0.9rem; font-weight: 700; color: #94a3b8; }
    </style>
</head>
<body>
    <div class="container">
        <a href="../../../index.html" class="btn-back">← Voltar para Central da Termodinâmica</a>
        
        <div class="header">
            <h1>🧠 Flashcards — Aula 03: Diagramas de Fase e Propriedades Térmicas</h1>
            <p>Clique no cartão para girar e ver a resposta. Teste seus conhecimentos!</p>
        </div>

        <div class="flashcard-wrapper">
            <div class="flashcard" id="card" onclick="flipCard()">
                <div class="front">
                    <span class="badge-cat" id="catDisplay">Pontos Notáveis</span>
                    <div class="card-text" id="frontText">Carregando...</div>
                    <span style="font-size: 0.78rem; color: #64748b; margin-top: 1.5rem;">👆 Clique para revelar a resposta</span>
                </div>
                <div class="back">
                    <span class="badge-cat" style="background: rgba(34, 197, 94, 0.15); color: #4ade80; border-color: rgba(34, 197, 94, 0.3);">Resposta</span>
                    <div class="card-text" id="backText">Carregando...</div>
                </div>
            </div>
        </div>

        <div class="controls">
            <button class="btn-ctrl" onclick="prevCard()">← Anterior</button>
            <span class="progress-text" id="progText">1 / 12</span>
            <button class="btn-ctrl" onclick="nextCard()">Próximo →</button>
        </div>
    </div>

    <script>
        const cardsData = [
            { front: "O que representa o Ponto Triplo no diagrama p x T?", back: "É o ponto único de pressão e temperatura em que as três fases (sólida, líquida e gasosa) coexistem simultaneamente em equilíbrio.", cat: "Pontos Notáveis" },
            { front: "O que é o Ponto Crítico em um diagrama de fases?", back: "É o ponto extremo da curva de vaporização acima do qual cessa a distinção física entre líquido e vapor.", cat: "Pontos Notáveis" },
            { front: "Qual a diferença entre gás e vapor?", back: "O vapor pode ser liquefeito apenas por compressão isotérmica; o gás exige resfriamento prévio abaixo da temperatura crítica.", cat: "Definições" },
            { front: "Por que a água apresenta inclinação negativa na curva de fusão?", back: "Porque a água se contrai ao fundir (e expande ao congelar); o aumento de pressão reduz a temperatura de fusão do gelo.", cat: "Anomalia da Água" },
            { front: "Como uma panela de pressão acelera o cozimento dos alimentos?", back: "Ela retém o vapor, aumentando a pressão interna para ~2 atm e elevando a temperatura de ebulição da água para ~120°C.", cat: "Aplicações" },
            { front: "Por que a água ferve a uma temperatura menor no topo de uma montanha elevada?", back: "Porque em altitude a pressão atmosférica é menor, exigindo menor energia térmica para igualar a pressão de vapor à pressão externa.", cat: "Altitude" },
            { front: "O que é o fenômeno do regelo?", back: "A fusão do gelo sob aumento de pressão local e o seu posterior recongelamento imediato quando a pressão cessa.", cat: "Fenômenos" },
            { front: "Por que a lâmina do patim desliza com facilidade sobre o gelo?", back: "A alta pressão exercida pela lâmina reduz a temperatura de fusão do gelo, criando uma fina lâmina de água líquida lubrificante.", cat: "Aplicações" },
            { front: "O que é a curva de sublimação?", back: "É a linha que separa a região sólida da região de vapor em pressões e temperaturas abaixo do ponto triplo.", cat: "Curvas de Equilíbrio" },
            { front: "Qual é a temperatura do ponto triplo da água em Kelvin e °C?", back: "273,16 K (ou 0,01 °C) sob a pressão de 4,58 mmHg.", cat: "Valores Notáveis" },
            { front: "Substâncias normais se expandem ou se contraem durante a fusão?", back: "Expandem-se. Por isso, para substâncias normais, o aumento de pressão eleva a temperatura de fusão.", cat: "Substâncias Normais" },
            { front: "O que ocorre se a pressão sobre um líquido for reduzida abaixo da pressão do ponto triplo?", back: "O líquido não pode mais existir; a substância passa a sublimar diretamente entre sólido e vapor.", cat: "Diagrama de Fase" }
        ];

        let currentIndex = 0;

        function updateCard() {
            const card = document.getElementById("card");
            card.classList.remove("flipped");
            setTimeout(() => {
                const item = cardsData[currentIndex];
                document.getElementById("frontText").textContent = item.front;
                document.getElementById("backText").textContent = item.back;
                document.getElementById("catDisplay").textContent = item.cat;
                document.getElementById("progText").textContent = `${currentIndex + 1} / ${cardsData.length}`;
            }, 150);
        }

        function flipCard() {
            document.getElementById("card").classList.toggle("flipped");
        }

        function nextCard() {
            currentIndex = (currentIndex + 1) % cardsData.length;
            updateCard();
        }

        function prevCard() {
            currentIndex = (currentIndex - 1 + cardsData.length) % cardsData.length;
            updateCard();
        }

        updateCard();
    </script>
</body>
</html>
